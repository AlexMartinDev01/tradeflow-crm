name: UI snapshot review
# snapshot-trigger: png-raster-pass
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui-snapshot-review.yml'
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          npm --prefix apps/api install
          npm --prefix apps/web install
          npm --prefix e2e install
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Build frontend
        run: npm --prefix apps/web run build
      - name: Initialize demo database
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/tradeflow-ui-review
          mkdir -p /tmp/tradeflow-ui-review/uploads /tmp/tradeflow-ui-review/backups
          env NODE_ENV=development HOST=127.0.0.1 PORT=18080 DB_FILE=/tmp/tradeflow-ui-review/tradeflow.db WEB_DIST="$GITHUB_WORKSPACE/apps/web/dist" UPLOAD_DIR=/tmp/tradeflow-ui-review/uploads BACKUP_DIR=/tmp/tradeflow-ui-review/backups APP_SECRET=tradeflow-ui-review CORS_ORIGIN='*' API_RATE_LIMIT=10000 AUTH_RATE_LIMIT=1000 node apps/api/server.mjs > /tmp/tradeflow-ui-review/bootstrap.log 2>&1 &
          pid=$!
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18080/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/api/health >/dev/null
          kill "$pid"
          wait "$pid" || true
          DB_FILE=/tmp/tradeflow-ui-review/tradeflow.db node scripts/seed-full-demo.mjs
      - name: Start application
        shell: bash
        run: |
          env NODE_ENV=development HOST=127.0.0.1 PORT=18080 DB_FILE=/tmp/tradeflow-ui-review/tradeflow.db WEB_DIST="$GITHUB_WORKSPACE/apps/web/dist" UPLOAD_DIR=/tmp/tradeflow-ui-review/uploads BACKUP_DIR=/tmp/tradeflow-ui-review/backups APP_SECRET=tradeflow-ui-review CORS_ORIGIN='*' API_RATE_LIMIT=10000 AUTH_RATE_LIMIT=1000 node apps/api/server.mjs > /tmp/tradeflow-ui-review/server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18080/api/ready >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/tradeflow-ui-review/server.log
          exit 1
      - name: Capture screenshots
        working-directory: e2e
        run: |
          mkdir -p ../ui-snapshots
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const base='http://127.0.0.1:18080';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1586,height:992},deviceScaleFactor:1});
          const res=await context.request.post(base+'/api/auth/login',{data:{username:'demo.manager',password:'Demo@TradeFlow2026!'}});
          if(!res.ok())throw new Error('login failed '+res.status()+' '+await res.text());
          const session=await res.json();
          await context.addInitScript(({token,user})=>{
            localStorage.setItem('token',token);
            localStorage.setItem('auth_user',JSON.stringify(user));
          },{token:session.token,user:session.user});
          const page=await context.newPage();
          for(const [name,path] of [['dashboard','/#/'],['customers','/#/customers'],['orders','/#/orders'],['shipments','/#/shipments']]){
            await page.goto(base+path,{waitUntil:'networkidle'});
            await page.waitForTimeout(800);
            await page.screenshot({path:'../ui-snapshots/'+name+'.png',fullPage:false});
          }
          await browser.close();
          NODE
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ui-snapshot-review
          path: ui-snapshots/*.png
          retention-days: 3
