name: TradeFlow Automation Scheduler

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TRADEFLOW_SCHEDULER_URL: ${{ secrets.TRADEFLOW_SCHEDULER_URL }}
      TRADEFLOW_SCHEDULER_TOKEN: ${{ secrets.TRADEFLOW_SCHEDULER_TOKEN }}
    steps:
      - name: Check scheduler configuration
        id: scheduler-config
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TRADEFLOW_SCHEDULER_URL}" ] || [ -z "${TRADEFLOW_SCHEDULER_TOKEN}" ]; then
            echo "::warning::TradeFlow scheduler is not configured yet. Set TRADEFLOW_SCHEDULER_URL and TRADEFLOW_SCHEDULER_TOKEN repository secrets when a stable production/Codespaces endpoint is available."
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "configured=true" >> "${GITHUB_OUTPUT}"

      - name: Trigger TradeFlow automation sweep
        if: steps.scheduler-config.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE="${TRADEFLOW_SCHEDULER_URL%/}"
          RESPONSE_FILE="$(mktemp)"
          STATUS="$(curl --silent --show-error             --connect-timeout 10             --max-time 45             --output "${RESPONSE_FILE}"             --write-out "%{http_code}"             --request POST             --header "Authorization: Bearer ${TRADEFLOW_SCHEDULER_TOKEN}"             --header "Content-Type: application/json"             --data '{}'             "${BASE}/api/automation/run")"
          cat "${RESPONSE_FILE}"
          echo
          if [ "${STATUS}" -lt 200 ] || [ "${STATUS}" -ge 300 ]; then
            echo "::error::TradeFlow automation endpoint returned HTTP ${STATUS}"
            exit 1
          fi
