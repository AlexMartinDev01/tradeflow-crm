name: TradeFlow Automation Scheduler

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TRADEFLOW_SCHEDULER_URL: ${{ secrets.TRADEFLOW_SCHEDULER_URL }}
      TRADEFLOW_SCHEDULER_TOKEN: ${{ secrets.TRADEFLOW_SCHEDULER_TOKEN }}
    steps:
      - name: Validate scheduler configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TRADEFLOW_SCHEDULER_URL}" ] || [ -z "${TRADEFLOW_SCHEDULER_TOKEN}" ]; then
            echo "::error::Missing TRADEFLOW_SCHEDULER_URL or TRADEFLOW_SCHEDULER_TOKEN repository secret."
            exit 1
          fi

      - name: Trigger TradeFlow automation sweep
        shell: bash
        run: |
          set -euo pipefail
          BASE="${TRADEFLOW_SCHEDULER_URL%/}"
          RESPONSE_FILE="$(mktemp)"
          STATUS="$(curl --silent --show-error             --connect-timeout 10             --max-time 45             --output "${RESPONSE_FILE}"             --write-out "%{http_code}"             --request POST             --header "Authorization: Bearer ${TRADEFLOW_SCHEDULER_TOKEN}"             --header "Content-Type: application/json"             --data '{}'             "${BASE}/api/automation/run")"
          cat "${RESPONSE_FILE}"
          echo
          if [ "${STATUS}" -lt 200 ] || [ "${STATUS}" -ge 300 ]; then
            echo "::error::TradeFlow automation endpoint returned HTTP ${STATUS}"
            exit 1
          fi
